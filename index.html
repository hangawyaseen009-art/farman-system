<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سیستەمی ژمێریاری پڕۆفیشنال</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="card">
    <h3>🔐 چوونەژوورەوە</h3>
    <input id="loginPass" type="password" placeholder="پاسۆرد">
    <button class="green" onclick="checkLogin()">چوونەژوورەوە</button>
  </div>
</div>

<header>
<h3>سیستەمی ژمێریاری</h3>
<div class="nav">
<button onclick="showPage('main')">بازرگانەکان</button>
<button onclick="showPage('income')">داهات / خەرجی / قەرز</button>
<button onclick="toggleDark()">🌙</button>
</div>
</header>

<div class="container">

<!-- PRIVATE -->
<div class="card">
<h4>حسابی تایبەت – فەرمان</h4>
<p>باڵانس: <b id="privateBalance">0</b></p>
<input id="pAmount" placeholder="بڕی پارە">
<select id="pType">
<option>زیادکردن</option>
<option>کەمکردنەوە</option>
</select>
<button class="green" onclick="privateAdd()">OK</button>
</div>

<!-- TRADERS -->
<div id="mainPage" class="card">
<h4>بازرگانەکان</h4>
<input id="nName" placeholder="ناو">
<input id="nPhone" placeholder="مۆبایل">
<input id="nAmount" placeholder="بڕی پارە">
<select id="nType">
<option>زیادکردن</option>
<option>کەمکردنەوە</option>
</select>
<button class="green" onclick="addTrader()">OK</button>

<table>
<thead>
<tr>
<th>ناو</th>
<th>مۆبایل</th>
<th>باڵانس</th>
<th>سڕینەوە</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<!-- INCOME -->
<div id="incomePage" class="card" style="display:none">
<h4>داهات / خەرجی / قەرز</h4>
<input id="inc" placeholder="داهات">
<button onclick="addVal('inc')">+</button>

<input id="exp" placeholder="خەرجی">
<button onclick="addVal('exp')">+</button>

<input id="debt" placeholder="قەرز">
<button onclick="addVal('debt')">+</button>

<p>💰 داهات: <b id="tInc">0</b></p>
<p>💸 خەرجی: <b id="tExp">0</b></p>
<p>📉 قەرز: <b id="tDebt">0</b></p>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
